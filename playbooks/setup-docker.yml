--- 
- name: Install docker environment on Target Node
  hosts: all
  become: yes
  tasks:
    - name: Update apt cache and install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes
    - name: Initiate Docker service and activate running with the system
      service:
        name: docker
        state: started
        enabled: yes
    - name: Permit ubuntu user run Docker without sudo command
      user:
        name: ubuntu
        groups: docker
        append: yes